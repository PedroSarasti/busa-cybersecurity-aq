<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="BUSA Cybersecurity - Dominando el Hacking Ético">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1013"/>
      <stop offset="0.45" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect x="0" y="338" width="1280" height="2" fill="#dc2626" fill-opacity="0.7"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Logo: escudo + BUSA (rojo) Cybersecurity (blanco), igual que el header del sitio -->
    <g transform="translate(100 58) scale(4.2)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
    </g>
    <text x="225" y="148" font-size="88" font-weight="800" text-anchor="start"><tspan fill="#ef4444">BUSA</tspan><tspan fill="#ffffff"> Cybersecurity</tspan></text>
    <text x="640" y="222" font-size="38" font-weight="700" fill="#ffffff">Dominando el <tspan fill="#ef4444">Hacking Ético</tspan></text>
    <text x="640" y="272" font-size="21" fill="#9ca3af">Documentación técnica, análisis de vulnerabilidades y metodologías de ciberseguridad ofensiva</text>
  </g>
</svg>
